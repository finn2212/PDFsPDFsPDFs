# Builds and publishes a release whenever a v* tag is pushed.
#
# One-time setup in the GitHub repo:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  SPARKLE_ED_PRIVATE_KEY
#   Value: output of `.build/artifacts/sparkle/Sparkle/bin/generate_keys -x /dev/stdout`
#          (the base64 private key line)
#
# Developer ID signing and notarization (without these the release stays ad hoc signed):
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" identity (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the password the .p12 was exported with
#   NOTARY_KEY_P8              base64 of the App Store Connect API key (AuthKey_<id>.p8)
#   NOTARY_KEY_ID              the key's ID
#   NOTARY_ISSUER_ID           the issuer ID
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # CFBundleVersion == marketing version, identical to scripts/release.sh —
          # mixing schemes would silently break Sparkle's version comparison.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Info.plist

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "::warning::No Developer ID secrets: this release is ad hoc signed and not notarized."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$IDENTITY" ] || { echo "ERROR: no Developer ID Application identity in the .p12" >&2; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build app (universal)
        run: ./build_app.sh

      - name: Notarize app
        if: env.SIGN_IDENTITY != ''
        run: ./scripts/notarize.sh dist/PDFsPDFsPDFs.app

      - name: Zip app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent dist/PDFsPDFsPDFs.app "dist/PDFsPDFsPDFs-$VERSION.zip"

      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_ED_PRIVATE_KEY" > /tmp/ed_key
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file /tmp/ed_key \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            dist/
          rm /tmp/ed_key
          # A key mismatch makes generate_appcast emit an UNSIGNED appcast with
          # exit 0; ad-hoc-signed apps hard-require the EdDSA signature.
          grep -q "sparkle:edSignature" dist/appcast.xml || {
            echo "ERROR: appcast has no EdDSA signature (secret does not match SUPublicEDKey?)" >&2
            exit 1
          }

      # Built after the appcast so generate_appcast never sees the .dmg — the .zip
      # stays the sole Sparkle update artifact; the .dmg is only a human download.
      - name: Build installer DMG
        run: |
          # The runner's Python is externally managed (PEP 668), so install
          # dmgbuild into a venv and put it on PATH for make_dmg.sh.
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet dmgbuild
          export PATH="/tmp/dmgvenv/bin:$PATH"
          ./scripts/make_dmg.sh "${GITHUB_REF_NAME#v}"

      # Idempotent: scripts/release.sh may already have published this tag
      # locally, in which case we refresh the assets instead of failing.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The version-less copy lets the website link to
          # releases/latest/download/PDFsPDFsPDFs.zip forever. It is created
          # only after the appcast exists, because generate_appcast scans
          # dist/ and would read a second zip as another release entry.
          mkdir -p dist/download
          cp "dist/PDFsPDFsPDFs-$VERSION.zip" dist/download/PDFsPDFsPDFs.zip
          # make_dmg.sh already wrote dist/PDFsPDFsPDFs-$VERSION.dmg + dist/download/PDFsPDFsPDFs.dmg.
          ASSETS=("dist/PDFsPDFsPDFs-$VERSION.zip" dist/download/PDFsPDFsPDFs.zip \
                  "dist/PDFsPDFsPDFs-$VERSION.dmg" dist/download/PDFsPDFsPDFs.dmg dist/appcast.xml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "PDFsPDFsPDFs $VERSION" \
              --generate-notes
          fi
